<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="LeadStock CRM pipeline: leads, follow-ups, quotation, orders, protected by row level security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14170e"/>
      <stop offset="1" stop-color="#0b0d07"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4f13c"/>
      <stop offset="1" stop-color="#f0a43a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4f13c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c4f13c" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c4f13c"/>
    </marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <circle cx="900" cy="260" r="360" fill="url(#glow)"/>

  <text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#eef3dc">LeadStock CRM</text>
  <text x="60" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#9aa387">Leads, quotations and orders for IT hardware resellers</text>
  <rect x="60" y="176" width="120" height="4" rx="2" fill="url(#brand)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g>
      <rect x="60" y="260" width="220" height="150" rx="22" fill="#1b2012" stroke="#c4f13c" stroke-opacity="0.55"/>
      <text x="90" y="318" font-size="20" fill="#c4f13c" letter-spacing="2">01</text>
      <text x="90" y="362" font-size="30" font-weight="600" fill="#eef3dc">Leads</text>
      <text x="90" y="392" font-size="17" fill="#9aa387">Capture and assign</text>
    </g>
    <g>
      <rect x="340" y="260" width="220" height="150" rx="22" fill="#1b2012" stroke="#c4f13c" stroke-opacity="0.55"/>
      <text x="370" y="318" font-size="20" fill="#c4f13c" letter-spacing="2">02</text>
      <text x="370" y="362" font-size="30" font-weight="600" fill="#eef3dc">Follow-ups</text>
      <text x="370" y="392" font-size="17" fill="#9aa387">Never miss a call</text>
    </g>
    <g>
      <rect x="620" y="260" width="220" height="150" rx="22" fill="#1b2012" stroke="#f0a43a" stroke-opacity="0.7"/>
      <text x="650" y="318" font-size="20" fill="#f0a43a" letter-spacing="2">03</text>
      <text x="650" y="362" font-size="30" font-weight="600" fill="#eef3dc">Quotation</text>
      <text x="650" y="392" font-size="17" fill="#9aa387">GST + live margin</text>
    </g>
    <g>
      <rect x="900" y="260" width="220" height="150" rx="22" fill="#1b2012" stroke="#c4f13c" stroke-opacity="0.55"/>
      <text x="930" y="318" font-size="20" fill="#c4f13c" letter-spacing="2">04</text>
      <text x="930" y="362" font-size="30" font-weight="600" fill="#eef3dc">Orders</text>
      <text x="930" y="392" font-size="17" fill="#9aa387">Delivery + invoices</text>
    </g>
  </g>

  <g stroke="#c4f13c" stroke-width="3" marker-end="url(#arrow)" fill="none">
    <path d="M284 335 H334"/>
    <path d="M564 335 H614"/>
    <path d="M844 335 H894"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="470" width="1060" height="84" rx="20" fill="#c4f13c" fill-opacity="0.07" stroke="#c4f13c" stroke-opacity="0.5" stroke-dasharray="8 8"/>
    <text x="90" y="520" font-size="26" font-weight="600" fill="#eef3dc">Row Level Security on every table</text>
    <text x="90" y="546" font-size="17" fill="#9aa387">Tenant isolation enforced in Postgres by organization and role</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#eef3dc">
    <rect x="60" y="610" width="130" height="46" rx="23" fill="#1b2012" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="125" y="640" text-anchor="middle">Owner</text>
    <rect x="206" y="610" width="130" height="46" rx="23" fill="#1b2012" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="271" y="640" text-anchor="middle">Admin</text>
    <rect x="352" y="610" width="140" height="46" rx="23" fill="#1b2012" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="422" y="640" text-anchor="middle">Manager</text>
    <rect x="508" y="610" width="170" height="46" rx="23" fill="#1b2012" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="593" y="640" text-anchor="middle">Salesperson</text>
    <text x="710" y="640" fill="#9aa387">Invite-only organisations</text>
  </g>
</svg>
